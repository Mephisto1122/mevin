services:
  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  mevin:
    build: .
    ports:
      - "5555:5555"
    volumes:
      # Database + alert snapshots (a folder, so Docker never creates monitor.db as a directory)
      - ./data:/app/data
    environment:
      - MEVIN_TOKEN=${MEVIN_TOKEN:-}
      # Reach Ollama through the compose network, not localhost
      - MEVIN_OLLAMA_URL=http://ollama:11434
    depends_on:
      - ollama
    restart: unless-stopped
    # ONVIF auto-discovery uses multicast, which needs the host network (Linux only):
    # network_mode: host
    # For USB cameras, uncomment:
    # devices:
    #   - /dev/video0:/dev/video0

volumes:
  ollama_data:
